<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماشین حساب طرح حامی بانک مسکن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', system-ui, sans-serif; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    .table-scroll { overflow-x: auto; }
    table { border-collapse: collapse; }
    th, td { white-space: nowrap; text-align: center !important; vertical-align: middle !important; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-8">
  <!-- Header -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-orange-500 rounded-2xl shadow-lg mb-4">
      <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
    </div>
    <h1 class="text-2xl md:text-3xl font-bold text-slate-800">ماشین حساب طرح حامی</h1>
    <p class="text-slate-500 mt-1">قرض‌الحسنه و سرمایه‌گذاری (مرابحه) – بانک مسکن</p>
  </div>

  <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="p-6 md:p-8 space-y-6">

      <!-- Scheme -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">نوع طرح</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="btn-qarz" onclick="setScheme('qarz')"
            class="scheme-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition">قرض‌الحسنه</button>
          <button type="button" id="btn-morabehe" onclick="setScheme('morabehe')"
            class="scheme-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition">سرمایه‌گذاری (مرابحه)</button>
        </div>
      </div>

      <!-- Mode -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">نوع محاسبه</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="btn-mode-avg" onclick="setMode('avg')"
            class="mode-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition text-sm">بر اساس متوسط موجودی</button>
          <button type="button" id="btn-mode-loan" onclick="setMode('loan')"
            class="mode-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition text-sm">بر اساس مبلغ تسهیلات</button>
        </div>
      </div>

      <!-- Person -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">نوع شخص</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="btn-real" onclick="setPersonType('real')"
            class="person-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition">حقیقی</button>
          <button type="button" id="btn-legal" onclick="setPersonType('legal')"
            class="person-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition">حقوقی</button>
        </div>
      </div>

      <!-- Input -->
      <div id="input-avg-box">
        <label class="block text-sm font-medium text-slate-700 mb-2">مبلغ متوسط موجودی <span class="text-slate-400 font-normal">(ریال)</span></label>
        <input type="number" id="avgBalance" min="0" step="1000000" value="2000000000" oninput="renderTable()"
          class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none text-lg font-medium">
        <p class="text-xs text-slate-400 mt-1.5" id="minHint">حداقل برای محاسبه امتیاز: ۱۰۰٬۰۰۰٬۰۰۰ ریال</p>
      </div>

      <div id="input-loan-box" class="hidden">
        <label class="block text-sm font-medium text-slate-700 mb-2">مبلغ تسهیلات مورد نظر <span class="text-slate-400 font-normal">(ریال)</span></label>
        <input type="number" id="desiredLoan" min="0" step="1000000" value="3000000000" oninput="renderTable()"
          class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none text-lg font-medium">
      </div>

      <!-- Rate -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2" id="rateLabel">نرخ کارمزد</label>
        <div class="grid grid-cols-2 gap-3" id="rateButtons"></div>
      </div>

      <!-- Section -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">بخش مصرف تسهیلات</label>
        <select id="section" onchange="renderTable()"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none bg-white">
          <option value="housing">بخش مسکن</option>
          <option value="service">بخش خدمات</option>
        </select>
      </div>

      <!-- Print Button -->
      <div class="pt-2">
        <button onclick="printSummary()" 
          class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-medium py-3.5 px-6 rounded-xl transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
          </svg>
          چاپ خلاصه برای مشتری (A4)
        </button>
      </div>
    </div>

    <!-- Results Table -->
    <div id="results" class="border-t border-slate-100 bg-slate-50 p-4 md:p-6">
      <h2 class="text-lg font-bold text-slate-800 mb-4">جدول تمام حالت‌های ممکن</h2>
      <div class="table-scroll rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-sm text-right">
          <thead class="bg-slate-100 text-slate-600 sticky top-0">
            <tr id="tableHead"></tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <div class="mt-4 bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800">
        <p class="font-medium mb-1">راهنما و نکات مهم:</p>
        <ul class="list-disc list-inside space-y-1 text-amber-700" id="notes-list"></ul>
      </div>
    </div>
  </div>

  <!-- Credit -->
  <p class="text-center text-sm text-slate-500 mt-6">
    تهیه و طراحی توسط <strong class="text-slate-700">مصطفی صالحی</strong>
  </p>
</div>

<script>
  let scheme = 'qarz';
  let mode = 'avg';
  let personType = 'real';
  let rate = 0;

  const COEFF = {
    qarz: {
      0:  { 12:14, 18:10, 24:8,  30:7,  36:6,  48:5 },
      4:  { 12:20, 18:14, 24:10, 30:8,  36:7,  48:6 }
    },
    morabehe: {
      10: { 6:25, 12:25, 18:18, 24:12, 30:10, 36:9, 42:8, 48:7, 60:7 },
      23: { 6:40, 12:40, 18:30, 24:24, 30:20, 36:18, 42:16, 48:15, 60:15 }
    }
  };

  const LIMITS = {
    qarz: {
      real:  { minAvg: 100_000_000,  maxLoan: 3_000_000_000,  minLoan: 100_000_000,  scoreCap: 20_000_000_000 },
      legal: { minAvg: 1_000_000_000, maxLoan: 7_500_000_000,  minLoan: 1_000_000_000, scoreCap: Infinity }
    },
    morabehe: {
      real:  { minAvg: 100_000_000,  maxLoan: 5_000_000_000,  minLoan: 100_000_000,  scoreCap: 20_000_000_000 },
      legal: { minAvg: 1_000_000_000, maxLoan: 20_000_000_000, minLoan: 1_000_000_000, scoreCap: Infinity }
    }
  };

  const PERIODS = [2, 3, 4, 5, 6, 7, 8];

  function roundUp10k(n) {
    if (n <= 0) return 0;
    return Math.ceil(n / 10000) * 10000;
  }

  function buildQarzSchedule(loanRial, annualRatePercent, totalMonths) {
    const loan = Math.round(loanRial / 10);
    const yearsApprox = Math.ceil(totalMonths / 12);
    let estFeeMonths = yearsApprox + 1;
    const principalMonths = Math.max(1, totalMonths - estFeeMonths);
    let principalInst = Math.round(loan / principalMonths / 1000) * 1000;
    return { principalInstRial: roundUp10k(principalInst * 10) };
  }

  function setScheme(s) {
    scheme = s;
    document.getElementById('btn-qarz').className = s === 'qarz'
      ? 'scheme-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition'
      : 'scheme-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition';
    document.getElementById('btn-morabehe').className = s === 'morabehe'
      ? 'scheme-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition'
      : 'scheme-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition';

    const container = document.getElementById('rateButtons');
    if (s === 'qarz') {
      rate = 0;
      container.innerHTML = `
        <button type="button" onclick="setRate(0)" class="rate-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition">۰٪</button>
        <button type="button" onclick="setRate(4)" class="rate-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition">۴٪</button>`;
      document.getElementById('rateLabel').textContent = 'نرخ کارمزد';
    } else {
      rate = 10;
      container.innerHTML = `
        <button type="button" onclick="setRate(10)" class="rate-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition">۱۰٪</button>
        <button type="button" onclick="setRate(23)" class="rate-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition">۲۳٪</button>`;
      document.getElementById('rateLabel').textContent = 'نرخ سود';
    }
    updateMinHint();
    renderTable();
  }

  function setMode(m) {
    mode = m;
    document.getElementById('btn-mode-avg').className = m === 'avg'
      ? 'mode-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition text-sm'
      : 'mode-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition text-sm';
    document.getElementById('btn-mode-loan').className = m === 'loan'
      ? 'mode-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition text-sm'
      : 'mode-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition text-sm';
    document.getElementById('input-avg-box').classList.toggle('hidden', m === 'loan');
    document.getElementById('input-loan-box').classList.toggle('hidden', m === 'avg');
    renderTable();
  }

  function setPersonType(t) {
    personType = t;
    document.getElementById('btn-real').className = t === 'real'
      ? 'person-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition'
      : 'person-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition';
    document.getElementById('btn-legal').className = t === 'legal'
      ? 'person-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition'
      : 'person-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition';
    updateMinHint();
    renderTable();
  }

  function setRate(r) {
    rate = r;
    document.querySelectorAll('.rate-btn').forEach(btn => {
      const isActive = (r === 0 && btn.textContent.includes('۰')) ||
                       (r === 4 && btn.textContent.includes('۴')) ||
                       (r === 10 && btn.textContent.includes('۱۰')) ||
                       (r === 23 && btn.textContent.includes('۲۳'));
      btn.className = isActive
        ? 'rate-btn py-3 px-4 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-medium transition'
        : 'rate-btn py-3 px-4 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition';
    });
    renderTable();
  }

  function updateMinHint() {
    const lim = LIMITS[scheme][personType];
    document.getElementById('minHint').textContent =
      `حداقل برای محاسبه امتیاز: ${lim.minAvg.toLocaleString('fa-IR')} ریال`;
  }

  function getAvailableRepays() {
    const section = document.getElementById('section').value;
    let options = [];
    if (scheme === 'qarz') {
      options = [12, 18, 24, 30, 36, 48];
      if (section === 'service') options = options.filter(m => m <= 24);
    } else {
      options = [6, 12, 18, 24, 30, 36, 42, 48];
      if (section === 'housing') options.push(60);
      if (section === 'service') options = options.filter(m => m <= 24);
    }
    return options;
  }

  function isRepayAllowedForPeriod(repay, period) {
    if (scheme === 'qarz') {
      if (period <= 2) return repay <= 24;
      if (period === 3) return repay <= 36;
      return true;
    }
    return true;
  }

  function calcMorabeheInstallment(principalRial, n, annualRate) {
    if (principalRial <= 0) return 0;
    let installment;
    if (n === 6) {
      installment = principalRial + principalRial * (annualRate / 100) * 0.5;
    } else {
      const r = (annualRate / 100) / 12;
      const factor = Math.pow(1 + r, n);
      installment = principalRial * r * factor / (factor - 1);
    }
    return roundUp10k(installment);
  }

  function formatRial(n) {
    if (n === 0 || !isFinite(n)) return '–';
    return Math.round(n).toLocaleString('fa-IR');
  }

  function getInstallment(loanAmount, repay, isQarz) {
    if (isQarz) {
      return buildQarzSchedule(loanAmount, rate, repay).principalInstRial;
    }
    return calcMorabeheInstallment(loanAmount, repay, rate);
  }

  function getRepayLabel(repay) {
    if (repay === 6) return '۶ ماه (نسیه دفعی)';
    if (repay === 60) return '۶۰ ماه <span class="text-xs text-amber-600 font-normal block">(ویژه خرید مسکن با مبایعه‌نامه)</span>';
    return repay + ' ماه';
  }

  function getRepayLabelPlain(repay) {
    if (repay === 6) return '۶ ماه (نسیه دفعی)';
    if (repay === 60) return '۶۰ ماه (ویژه خرید مسکن)';
    return repay + ' ماه';
  }

  function renderTable() {
    const lim = LIMITS[scheme][personType];
    const repays = getAvailableRepays();
    const isQarz = scheme === 'qarz';

    document.getElementById('tableHead').innerHTML = `
      <th class="px-3 py-3 font-semibold text-slate-700">مدت بازپرداخت</th>
      <th class="px-3 py-3 font-semibold text-slate-700">ضریب ماهانه</th>
      ${PERIODS.map(p => `<th class="px-3 py-3 font-semibold text-slate-700 bg-slate-50">دوره ${p} ماهه</th>`).join('')}
    `;

    const body = document.getElementById('tableBody');
    body.innerHTML = '';

    const avgInput = parseFloat(document.getElementById('avgBalance').value) || 0;
    const loanInput = parseFloat(document.getElementById('desiredLoan').value) || 0;

    repays.forEach(repay => {
      const monthlyCoeff = COEFF[scheme][rate]?.[repay];
      if (!monthlyCoeff) return;

      const tr = document.createElement('tr');
      tr.className = 'hover:bg-orange-50/50 transition';

      let cells = `
        <td class="px-3 py-3 font-medium text-slate-800">${getRepayLabel(repay)}</td>
        <td class="px-3 py-3 text-slate-600">${monthlyCoeff}٪</td>
      `;

      PERIODS.forEach(period => {
        if (!isRepayAllowedForPeriod(repay, period)) {
          cells += `<td class="px-3 py-3 text-slate-300 text-center">–</td>`;
          return;
        }

        const multiplier = (monthlyCoeff / 100) * period;
        let displayValue = '';

        if (mode === 'avg') {
          if (avgInput < lim.minAvg) {
            displayValue = '<span class="text-red-500 text-xs">کمتر از حداقل</span>';
          } else {
            let fullScore = Math.floor(avgInput * multiplier);
            const scoreAfterCap = Math.min(fullScore, lim.scoreCap);
            let cappedLoan = Math.min(scoreAfterCap, lim.maxLoan);
            if (cappedLoan < lim.minLoan) cappedLoan = 0;

            if (cappedLoan === 0) {
              displayValue = '<span class="text-slate-400">غیرقابل پرداخت</span>';
            } else if (scoreAfterCap > cappedLoan) {
              displayValue = `
                <div class="text-xs text-slate-500">کل امتیاز:</div>
                <div class="font-semibold text-slate-800">${formatRial(scoreAfterCap)}</div>
                <div class="text-xs text-slate-500">قسط: ${formatRial(getInstallment(scoreAfterCap, repay, isQarz))}</div>
                <div class="border-t border-slate-200 my-1.5"></div>
                <div class="text-xs text-slate-500">سقف ۱ نفر:</div>
                <div class="font-semibold text-orange-600">${formatRial(cappedLoan)}</div>
                <div class="text-xs text-slate-500">قسط: ${formatRial(getInstallment(cappedLoan, repay, isQarz))}</div>
              `;
            } else {
              displayValue = `
                <div class="font-semibold text-orange-600">${formatRial(cappedLoan)}</div>
                <div class="text-xs text-slate-500 mt-0.5">قسط: ${formatRial(getInstallment(cappedLoan, repay, isQarz))}</div>
              `;
            }
          }
        } else {
          if (loanInput < lim.minLoan || loanInput > lim.maxLoan) {
            displayValue = '<span class="text-red-500 text-xs">خارج از سقف</span>';
          } else {
            const requiredAvg = loanInput / multiplier;
            displayValue = `
              <div class="font-semibold text-emerald-600">${formatRial(requiredAvg)}</div>
              <div class="text-xs text-slate-500 mt-0.5">قسط: ${formatRial(getInstallment(loanInput, repay, isQarz))}</div>
            `;
          }
        }

        cells += `<td class="px-3 py-3 text-center">${displayValue}</td>`;
      });

      tr.innerHTML = cells;
      body.appendChild(tr);
    });

    const notes = document.getElementById('notes-list');
    if (isQarz) {
      notes.innerHTML = `
        <li><strong>روش ویژه قرض‌الحسنه:</strong> ماه اول و هر فروردین فقط کارمزد پرداخت می‌شود؛ در ماه‌های دیگر قسط پرداخت می‌شود.</li>
        <li>حداقل متوسط موجودی برای محاسبه امتیاز: ${lim.minAvg.toLocaleString('fa-IR')} ریال؛ سقف فردی تسهیلات: ${lim.maxLoan.toLocaleString('fa-IR')} ریال.</li>
        <li>هر مشتری فقط مجاز به داشتن <strong>یک فقره تسهیلات زنده</strong> است.</li>
        ${personType === 'real' ? '<li><strong>توضیحات حقیقی:</strong> انتقال امتیاز به همسر، پدر، مادر، فرزند، خواهر، برادر، پدربزرگ، مادربزرگ، نوه، پدرِ همسر و مادرِ همسر بدون محدودیت سقف سالانه مجاز است؛ انتقال به سایر اشخاص حقیقی تا سقف مجموع سالانه ۱۰ میلیارد ریال و با رعایت ضوابط بانک امکان‌پذیر است.</li>' : '<li><strong>توضیحات حقوقی:</strong> انتقال امتیاز فقط به کارکنان همان شخص حقوقی و مشروط به حداقل ۳ ماه سابقه پرداخت حق بیمه مجاز است.</li>'}
        <li><strong>ممنوعیت‌ها:</strong> خریدوفروش امتیاز تحت هر عنوان ممنوع است و انتقال‌گیرنده نمی‌تواند امتیاز منتقل‌شده را به شخص دیگری منتقل کند. احراز نسبت، مدارک و کنترل سقف سالانه بر عهده شعبه طبق دستورالعمل است.</li>
        <li><strong>سقف محاسبه امتیاز:</strong> برای هر حساب حقیقی در هر دوره مؤثر، حداکثر ۲۰ میلیارد ریال اعتبار برای محاسبه امتیاز منظور می‌شود. ظرفیت اشخاص حقوقی باید طبق تعداد دقیق کارکنان/اعضای زیرمجموعه در سامانه MCDS تعیین شود و پس از قطعی‌شدن اولین تسهیلات قابل تغییر نیست.</li>
        <li>۴ رقم آخر اقساط به بالا و به مضرب ۱۰٬۰۰۰ ریال گرد می‌شود. محاسبات تقریبی است و تأیید نهایی با شعبه است.</li>
      `;
    } else {
      notes.innerHTML = `

  // ==================== PRINT ====================
  function printSummary() {
    const lim = LIMITS[scheme][personType];
    const isQarz = scheme === 'qarz';
    const section = document.getElementById('section').value;
    const avgInput = parseFloat(document.getElementById('avgBalance').value) || 0;
    const loanInput = parseFloat(document.getElementById('desiredLoan').value) || 0;
    const repays = getAvailableRepays();
    const printPeriods = [3, 4, 6, 8];

    const now = new Date();
    const dateStr = now.toLocaleDateString('fa-IR') + '  |  ' + now.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});

    let metaHtml = `
      <div><b>نوع شخص:</b> ${personType === 'real' ? 'حقیقی' : 'حقوقی'}</div>
      <div><b>بخش مصرف:</b> ${section === 'housing' ? 'مسکن' : 'خدمات'}</div>
      <div><b>نرخ ${isQarz ? 'کارمزد' : 'سود'}:</b> ${rate}٪</div>
    `;
    if (mode === 'avg') {
      metaHtml += `<div><b>متوسط موجودی:</b> ${formatRial(avgInput)} ریال</div>`;
    } else {
      metaHtml += `<div><b>مبلغ تسهیلات درخواستی:</b> ${formatRial(loanInput)} ریال</div>`;
    }
    metaHtml += `<div><b>سقف فردی:</b> ${formatRial(lim.maxLoan)} ریال</div>`;

    let tableHead = `
      <th>مدت بازپرداخت</th>
      <th>ضریب</th>
      ${printPeriods.map(p => `<th>دوره ${p} ماهه</th>`).join('')}
    `;

    let tableBody = '';
    repays.forEach(repay => {
      const monthlyCoeff = COEFF[scheme][rate]?.[repay];
      if (!monthlyCoeff) return;

      tableBody += `<tr>
        <td style="font-weight:600">${getRepayLabelPlain(repay)}</td>
        <td style="text-align:center">${monthlyCoeff}٪</td>`;

      printPeriods.forEach(period => {
        if (!isRepayAllowedForPeriod(repay, period)) {
          tableBody += `<td style="text-align:center;color:#888">–</td>`;
          return;
        }

        const multiplier = (monthlyCoeff / 100) * period;
        let cell = '';

        if (mode === 'avg') {
          if (avgInput < lim.minAvg) {
            cell = 'کمتر از حداقل';
          } else {
            let fullScore = Math.floor(avgInput * multiplier);
            const scoreAfterCap = Math.min(fullScore, lim.scoreCap);
            let capped = Math.min(scoreAfterCap, lim.maxLoan);
            if (capped < lim.minLoan) capped = 0;

            if (capped === 0) {
              cell = 'غیرقابل پرداخت';
            } else if (scoreAfterCap > capped) {
              cell = `کل امتیاز: ${formatRial(scoreAfterCap)}<br>قسط: ${formatRial(getInstallment(scoreAfterCap, repay, isQarz))}<br>
                      <span style="font-size:8pt">سقف فردی: ${formatRial(capped)} | قسط: ${formatRial(getInstallment(capped, repay, isQarz))}</span>`;
            } else {
              cell = `${formatRial(capped)}<br><span style="font-size:8pt">قسط: ${formatRial(getInstallment(capped, repay, isQarz))}</span>`;
            }
          }
        } else {
          if (loanInput < lim.minLoan || loanInput > lim.maxLoan) {
            cell = 'خارج از سقف';
          } else {
            const reqAvg = loanInput / multiplier;
            cell = `${formatRial(reqAvg)}<br><span style="font-size:8pt">قسط: ${formatRial(getInstallment(loanInput, repay, isQarz))}</span>`;
          }
        }
        tableBody += `<td style="text-align:center;font-size:9pt">${cell}</td>`;
      });
      tableBody += `</tr>`;
    });

    const transferRulesQarz = `

      <li>اشخاص حقوقی فقط می‌توانند امتیاز را به کارکنان خود با حداقل ۳ ماه سابقه پرداخت حق بیمه منتقل کنند.</li>
    `;
    let notes = '';
    if (isQarz) {
